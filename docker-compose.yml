# ローカル/セルフホスト向けの一番簡単な実行手段
#   docker compose up -d
services:
  miragevpn:
    build: .
    image: miragevpn:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      # 必ず書き換える (この値のまま公開しないこと)
      MIRAGE_SECRET: please-change-me
      MIRAGE_EGRESS: auto
      MIRAGE_ADBLOCK: "1"
      MIRAGE_WISP: "1"
      MIRAGE_STATE_DIR: /app/data/state
      MIRAGE_LOG_LEVEL: info
    volumes:
      # 設定・プールスナップショット・レポートを永続化
      - mirage-state:/app/data/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/mirage/api/health"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
volumes:
  mirage-state:
